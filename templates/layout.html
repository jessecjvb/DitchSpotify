<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DitchSpotify{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Top Navigation Bar (Same on all pages) -->
    <header class="navbar">
        <div class="nav-brand">
            <a href="{{ url_for('home') }}" class="brand-link">
                <img src="{{ url_for('static', filename='DitchSpotify.png') }}" alt="DitchSpotify Icon">
                <span class="brand-title">DitchSpotify</span>
            </a>
        </div>
        <nav class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('connect') }}">Your Recommendation</a>
        </nav>
    </header>

    <!-- Page Specific Content Injects Here -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
